<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 献立作成</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 16px 50px; }
  .header { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 22px 28px; text-align: center; }
  .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  .header p  { font-size: 13px; opacity: .8; margin-top: 4px; }
  .card { background: white; width: 100%; max-width: 520px; border-radius: 0 0 18px 18px; padding: 28px 28px 32px; box-shadow: 0 8px 32px rgba(0,0,0,.10); }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: #555; margin-bottom: 8px; letter-spacing: .5px; text-transform: uppercase; }
  .field label span { font-size: 16px; margin-right: 6px; }
  .date-row { display: flex; gap: 10px; align-items: center; }
  input[type="date"] { flex: 1; padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; color: #333; outline: none; transition: border-color .2s; font-family: inherit; }
  input[type="date"]:focus { border-color: #2ecc71; }
  .today-btn { padding: 10px 16px; background: #f0f4f8; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; white-space: nowrap; transition: all .2s; font-family: inherit; }
  .today-btn:hover { background: #e8f5e9; border-color: #2ecc71; color: #27ae60; }
  .meal-row { display: flex; gap: 12px; }
  .meal-option { flex: 1; }
  .meal-option input[type="radio"] { display: none; }
  .meal-option label { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 10px; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; color: #777; transition: all .2s; text-transform: none; letter-spacing: 0; }
  .meal-option input[type="radio"]:checked + label { border-color: #2ecc71; background: #e8f5e9; color: #27ae60; }
  .meal-option label:hover { border-color: #a8e6c1; }
  textarea { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: inherit; color: #333; resize: vertical; outline: none; transition: border-color .2s; min-height: 110px; line-height: 1.6; }
  textarea:focus { border-color: #2ecc71; }
  textarea::placeholder { color: #bbb; }
  .btn-save { width: 100%; padding: 16px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: 1px; transition: transform .1s, box-shadow .2s; box-shadow: 0 4px 16px rgba(46,204,113,.4); font-family: inherit; margin-top: 4px; }
  .btn-save:hover  { box-shadow: 0 6px 20px rgba(46,204,113,.5); }
  .btn-save:active { transform: scale(.98); }
  .btn-clear { width: 100%; padding: 11px; background: #f5f5f5; color: #888; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; font-family: inherit; transition: background .2s; }
  .btn-clear:hover { background: #eee; }
  #toast { position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #2c3e50; color: white; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.175,.885,.32,1.275); z-index: 999; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  #modal-overlay.open { display: flex; }
  #modal { background: white; border-radius: 18px; padding: 28px 28px 24px; width: 90%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  #modal h2 { font-size: 18px; color: #2c3e50; margin-bottom: 14px; }
  #modal pre { background: #f8f9fa; border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.7; color: #333; white-space: pre-wrap; word-break: break-all; font-family: inherit; margin-bottom: 18px; border: 1px solid #eee; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn-copy { flex: 1; padding: 12px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .modal-btn-cancel { flex: 1; padding: 12px; background: #f0f0f0; color: #666; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .step-hint { font-size: 12px; color: #888; text-align: center; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="header">
  <h1>🍱 献立作成</h1>
  <p>日付・区分・つまみ・握りを入力してメモに追加</p>
</div>
<div class="card">
  <div class="field">
    <label><span>📅</span>日付</label>
    <div class="date-row">
      <input type="date" id="date-input">
      <button class="today-btn" onclick="setToday()">今日</button>
    </div>
  </div>
  <div class="field">
    <label><span>🍽</span>区分</label>
    <div class="meal-row">
      <div class="meal-option">
        <input type="radio" name="meal" id="lunch" value="ランチ" checked>
        <label for="lunch">☀️ ランチ</label>
      </div>
      <div class="meal-option">
        <input type="radio" name="meal" id="dinner" value="ディナー">
        <label for="dinner">🌙 ディナー</label>
      </div>
    </div>
  </div>
  <div class="field">
    <label><span>🍶</span>つまみ</label>
    <textarea id="tsumami" placeholder="例：枝豆、冷奴、唐揚げ…"></textarea>
  </div>
  <div class="field">
    <label><span>🍣</span>握り</label>
    <textarea id="nigiri" placeholder="例：まぐろ、サーモン、いくら…"></textarea>
  </div>
  <button class="btn-save" onclick="preview()">📝 メモアプリに追加</button>
  <button class="btn-clear" onclick="clearForm()">クリア</button>
</div>
<div id="toast">✅ メモアプリに追加しました！</div>
<div id="modal-overlay">
  <div id="modal">
    <h2>📋 メモの内容を確認</h2>
    <pre id="preview-text"></pre>
    <div class="modal-btns">
      <button class="modal-btn-copy" onclick="addToNotes()">📝 メモアプリに追加</button>
      <button class="modal-btn-cancel" onclick="closeModal()">キャンセル</button>
    </div>
    <p class="step-hint">ショートカットが自動でメモアプリに追加します ✅</p>
  </div>
</div>
<script>
  function setToday() {
    const d = new Date();
    document.getElementById('date-input').valueAsDate = d;
  }
  setToday();

  function formatDate(val) {
    if (!val) return '';
    const [y, m, d] = val.split('-');
    return `${y}/${m}/${d}`;
  }

  function buildContent() {
    const dateVal  = document.getElementById('date-input').value;
    const meal     = document.querySelector('input[name="meal"]:checked').value;
    const tsumami  = document.getElementById('tsumami').value.trim();
    const nigiri   = document.getElementById('nigiri').value.trim();
    const dateStr  = formatDate(dateVal) || '（日付未設定）';
    return `【${dateStr}　${meal}】\n\n■ つまみ\n${tsumami || '（なし）'}\n\n■ 握り\n${nigiri || '（なし）'}`;
  }

  function preview() {
    const dateVal = document.getElementById('date-input').value;
    if (!dateVal) { alert('日付を選択してください。'); return; }
    document.getElementById('preview-text').textContent = buildContent();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  async function addToNotes() {
    const content = buildContent();
    try {
      await navigator.clipboard.writeText(content);
    } catch(e) {
      const url = 'shortcuts://run-shortcut?name=' +
                  encodeURIComponent('献立メモ追加') +
                  '&input=text&text=' +
                  encodeURIComponent(content);
      closeModal();
      showToast('✅ メモアプリに追加しました！');
      window.location.href = url;
      clearForm();
      return;
    }
    closeModal();
    showToast('✅ メモアプリに追加しました！');
    window.location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('献立メモ追加');
    clearForm();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || '✅ 完了！';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function clearForm() {
    setToday();
    document.getElementById('lunch').checked = true;
    document.getElementById('tsumami').value = '';
    document.getElementById('nigiri').value  = '';
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
